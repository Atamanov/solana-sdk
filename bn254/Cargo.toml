[package]
name = "solana-bn254"
description = "Solana BN254"
documentation = "https://docs.rs/solana-bn254"
version = "3.2.1"
authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
edition = { workspace = true }
include = ["src/**/*", "build.rs", "mcl_bridge/**/*"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
all-features = true
rustdoc-args = ["--cfg=docsrs"]

[dependencies]
bytemuck = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }

[target.'cfg(not(target_os = "solana"))'.dependencies]
ark-bn254 = { workspace = true }
ark-bn254-06 = { package = "ark-bn254", version = "0.6.0" }
ark-ec = { workspace = true }
ark-ec-06 = { package = "ark-ec", version = "0.6.0" }
ark-ff = { workspace = true }
ark-ff-06 = { package = "ark-ff", version = "0.6.0" }
ark-serialize = { workspace = true }
ark-serialize-06 = { package = "ark-serialize", version = "0.6.0" }
helius-narsil = { git = "https://github.com/Atamanov/helius-narsil.git", rev = "b3d6299009a62dc8906dc94c699219606b383821", features = ["std"] }

[target.'cfg(target_os = "solana")'.dependencies]
solana-define-syscall = { workspace = true }

[build-dependencies]
cc = "1.2"

[dev-dependencies]
array-bytes = { workspace = true }
criterion = { workspace = true }
serde = { workspace = true }
serde_derive = { workspace = true }
serde_json = { workspace = true }

[[bench]]
name = "bn254"
harness = false

[lints]
workspace = true
